name: Deploy

# Ogni push su main aggiorna il server. Il runner gira sulla macchina di
# produzione, quindi non serve nessuna credenziale SSH e nessun segreto:
# e' la macchina stessa che va a prendersi il codice.
on:
  push:
    branches: [main]
  # Per rilanciare un aggiornamento senza dover fare un commit finto.
  workflow_dispatch:

# Un aggiornamento alla volta. Due deploy in parallelo vorrebbero dire due
# `npm run build` sulla stessa cartella, e su Windows finisce con file bloccati.
concurrency:
  group: deploy-produzione
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, windows, comanda]
    steps:
      # Niente checkout: il clone servito vive fuori dalla cartella di lavoro
      # del runner, perche' contiene .env.production.local e public\uploads,
      # che un checkout pulito cancellerebbe a ogni aggiornamento.
      #
      # Questo percorso e' l'unico posto dove sta scritto dove vive il clone:
      # lo script, da li' dentro, ricava da se' stesso la cartella su cui
      # lavorare. Se un giorno il clone si sposta, si cambia questa riga e
      # basta — ma finche' non la si cambia, il deploy si ferma invece di
      # aggiornare la cartella sbagliata.
      - name: Aggiorna la produzione
        shell: powershell
        run: |
          $percorso = "C:\Users\Samuele Viola\Documents\Progetti\Gestionale-Locali\scripts\deploy.ps1"
          if (-not (Test-Path $percorso)) {
            throw "Non trovo $percorso. Se il clone servito si e' spostato, aggiorna il percorso in .github/workflows/deploy.yml."
          }
          powershell -ExecutionPolicy Bypass -File $percorso
          exit $LASTEXITCODE
