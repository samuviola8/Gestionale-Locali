<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Comanda">
  <!--
    L'occhio del QR: l'anello e il nucleo, il segno che il cliente inquadra
    sul tavolo. A 16 pixel sopravvivono pochissime forme, e due geometrie
    concentriche separate da un vuoto largo sono fra quelle: niente tratti
    sottili, niente lettere, niente dettagli che a quella misura diventano
    sporco.

    Oro su quasi-nero perche' la tessera funziona sia su una barra chiara sia
    su una scura: un marchio chiaro sparirebbe su meta' dei browser.
  -->
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cd86" />
      <stop offset="1" stop-color="#c58f2e" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="#0b0d0c" />

  <!-- Anello. Spessore 3.2 su 32: a 16px resta 1.6px pieno, sopra la soglia
       oltre la quale un contorno diventa una sfumatura grigia. -->
  <rect
    x="7" y="7" width="18" height="18" rx="4.6"
    fill="none" stroke="url(#oro)" stroke-width="3.2"
  />

  <!-- Nucleo. Il vuoto fra anello e nucleo e' 3.6 su 32, cioe' quasi 2px a
       16: e' quel vuoto a far leggere il segno, non le forme. -->
  <rect x="13.8" y="13.8" width="4.4" height="4.4" rx="1.3" fill="url(#oro)" />
</svg>
